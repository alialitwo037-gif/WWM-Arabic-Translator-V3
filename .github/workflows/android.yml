name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build with Gradle (Continue on Error)
      run: gradle assembleDebug --no-daemon --continue --stacktrace

    - name: Diagnose Missing Files & Resource Issues
      if: failure()
      run: |
        echo "=================================================="
        echo "         Diagnostic & Comprehensive Report        "
        echo "=================================================="
        echo "Checking required structure and files:"
        [ -f "app/src/main/AndroidManifest.xml" ] && echo "✔ AndroidManifest.xml" || echo "✖ MISSING: AndroidManifest.xml"
        [ -f "app/src/main/res/layout/activity_main.xml" ] && echo "✔ activity_main.xml" || echo "✖ MISSING: activity_main.xml"
        [ -f "app/src/main/res/values/styles.xml" ] || [ -f "app/src/main/res/values/themes.xml" ] && echo "✔ Theme file exists" || echo "✖ MISSING: app/src/main/res/values/themes.xml"
        [ -f "app/src/main/java/com/wwm/arabictranslator/MainActivity.kt" ] && echo "✔ MainActivity.kt" || echo "✖ MISSING: MainActivity.kt"
