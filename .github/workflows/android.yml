name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Diagnose Failure & Suggest Fixes
      if: failure()
      run: |
        echo "=================================================="
        echo "           Diagnostic & Solution Report           "
        echo "=================================================="
        echo ""
        echo "Checking required repository files..."
        
        [ -f "settings.gradle.kts" ] && echo "✔ settings.gradle.kts exists" || echo "✖ MISSING: settings.gradle.kts"
        [ -f "gradle.properties" ] && echo "✔ gradle.properties exists" || echo "✖ MISSING: gradle.properties"
        [ -f "app/build.gradle.kts" ] && echo "✔ app/build.gradle.kts exists" || echo "✖ MISSING: app/build.gradle.kts"
        [ -f "app/src/main/AndroidManifest.xml" ] && echo "✔ AndroidManifest.xml exists" || echo "✖ MISSING: app/src/main/AndroidManifest.xml"
        [ -f "app/src/main/res/layout/activity_main.xml" ] && echo "✔ activity_main.xml exists" || echo "✖ MISSING: app/src/main/res/layout/activity_main.xml"
        [ -f "app/src/main/java/com/wwm/arabictranslator/MainActivity.kt" ] && echo "✔ MainActivity.kt exists" || echo "✖ MISSING: app/src/main/java/com/wwm/arabictranslator/MainActivity.kt"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
